name: Backend CI

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Suite hermética
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout sin catálogo rastreado
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            /*
            !/database/proyecta.db
          sparse-checkout-cone-mode: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Preparar SQLite temporal
        shell: bash
        run: |
          set -euo pipefail
          test ! -e database/proyecta.db
          database_path="${RUNNER_TEMP}/zentra-ci/proyecta.db"
          mkdir -p "$(dirname "${database_path}")"
          printf 'DATABASE_PATH=%s\n' "${database_path}" >> "${GITHUB_ENV}"

      - name: Instalar dependencias
        run: python -m pip install --requirement requirements.txt

      - name: Verificar whitespace del rango real
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero_sha=0000000000000000000000000000000000000000

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git diff --check "${PR_BASE_SHA}" "${PR_HEAD_SHA}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${PUSH_BEFORE_SHA}" != "${zero_sha}" ]]; then
            git diff --check "${PUSH_BEFORE_SHA}" "${CURRENT_SHA}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            git diff-tree --check --root --no-commit-id -r "${CURRENT_SHA}"
          elif git rev-parse "${CURRENT_SHA}^" >/dev/null 2>&1; then
            git diff --check "${CURRENT_SHA}^" "${CURRENT_SHA}"
          else
            git diff-tree --check --root --no-commit-id -r "${CURRENT_SHA}"
          fi

      - name: Ejecutar suite hermética
        run: python scripts/ci/run_hermetic_tests.py
